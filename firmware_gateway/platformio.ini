[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ================================
; LIBRARIES REQUIRED FOR GATEWAY
; ================================
lib_deps =
    blynkkk/Blynk@^1.3.2
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^7.0.0

    ; WiFi + HTTP
    WiFi
    HTTPClient

; ================================
; BUILD OPTIONS
; ================================
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0

; ================================
; UPLOAD & PORT CONFIG (optional)
; ================================
upload_speed = 921600
